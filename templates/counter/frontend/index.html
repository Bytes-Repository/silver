<div class="page">
    <div class="card">
        <h1>Licznik</h1>
        <p>Wartość: <span class="count">{{count}}</span></p>
        <div class="button plus" id="inc" on-click="increment">
            <span>+ Zwiększ</span>
        </div>
        <div class="button minus" id="dec" on-click="decrement">
            <span>- Zmniejsz</span>
        </div>
    </div>
</div>
